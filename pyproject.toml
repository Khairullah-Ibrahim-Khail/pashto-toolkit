[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pashto-toolkit"
version = "0.1.0"
description = "Pashto and Afghan fake data generation, with no dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khairullah Ibrahim Khail" }]
keywords = ["pashto", "afghanistan", "fake-data", "test-data", "locale", "pa_AF", "en_AF", "pashto-nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Pashto",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Khairullah-Ibrahim-Khail/pashto-toolkit"
Documentation = "https://github.com/Khairullah-Ibrahim-Khail/pashto-toolkit#readme"
Source = "https://github.com/Khairullah-Ibrahim-Khail/pashto-toolkit"
Changelog = "https://github.com/Khairullah-Ibrahim-Khail/pashto-toolkit/blob/main/CHANGELOG.md"
Contributing = "https://github.com/Khairullah-Ibrahim-Khail/pashto-toolkit/blob/main/CONTRIBUTING.md"
Issues = "https://github.com/Khairullah-Ibrahim-Khail/pashto-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pashto_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The providers deliberately mirror Faker's own source style, which still uses
# typing.List / typing.Tuple rather than PEP 585 builtin generics.
ignore = ["UP006", "UP035"]
